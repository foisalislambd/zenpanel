# Publishes create-zenpanel after CI succeeds on main.
# Order: version bump → npmjs (Trusted Publisher) → GitHub Packages → GitHub Release + tag.
# If CI fails, this workflow does not publish.
#
# Skip: put [skip release] in the commit message (no npm / GitHub Packages / release).
#
# Versioning (auto, starts at 2.0.0):
#   2.0.0 → 2.0.1 → … → 2.0.9 → 2.1.0 → … → 2.9.9 → 3.0.0
#
# npm Trusted Publisher (one-time on npmjs.com → create-zenpanel → Settings):
#   Organization or user: foisalislambd
#   Repository:           zenpanel
#   Workflow filename:    release.yml
#   Allowed actions:      npm publish

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and release
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
      id-token: write
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # Required so version bump can see existing v*.*.* tags.
          fetch-tags: true

      - name: Check [skip release]
        id: skip
        run: |
          MSG="$(git log -1 --format=%B)"
          echo "Head commit message:"
          printf '%s\n' "$MSG"
          if printf '%s\n' "$MSG" | grep -qi '\[skip release\]'; then
            echo "Skipping release — commit contains [skip release]."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          # No registry-url: empty _authToken can block Trusted Publisher (OIDC).
          node-version: "24"
          cache: npm

      - name: Ensure npm supports Trusted Publisher (OIDC)
        if: steps.skip.outputs.skip != 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.skip.outputs.skip != 'true'
        run: npm ci

      - name: Fetch all tags
        if: steps.skip.outputs.skip != 'true'
        run: git fetch --tags --force origin

      - name: Resolve next version
        if: steps.skip.outputs.skip != 'true'
        id: meta
        run: |
          VERSION="$(node <<'EOF'
          const { execSync } = require("node:child_process");

          function parse(tag) {
            const m = String(tag).replace(/^v/, "").match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!m) return null;
            const parts = [Number(m[1]), Number(m[2]), Number(m[3])];
            // Scheme only uses single digits 0–9 per segment.
            if (parts.some((n) => n > 9)) return null;
            return parts;
          }

          function cmp(a, b) {
            for (let i = 0; i < 3; i++) {
              if (a[i] !== b[i]) return a[i] - b[i];
            }
            return 0;
          }

          function bump([maj, min, pat]) {
            pat += 1;
            if (pat > 9) {
              pat = 0;
              min += 1;
            }
            if (min > 9) {
              min = 0;
              maj += 1;
            }
            return [maj, min, pat];
          }

          function fmt(parts) {
            return parts.join(".");
          }

          const start = [2, 0, 0];
          const tags = execSync("git tag -l", { encoding: "utf8" })
            .split("\n")
            .map((t) => t.trim())
            .filter(Boolean);

          let latest = null;
          for (const tag of tags) {
            const parts = parse(tag);
            if (!parts) continue;
            if (cmp(parts, start) < 0) continue; // ignore pre-2.0.0 tags
            if (!latest || cmp(parts, latest) > 0) latest = parts;
          }

          let next = latest ? bump(latest) : start;

          // Skip versions that already have a tag or GitHub Release (partial retries).
          const exists = (version) => {
            const tag = `v${version}`;
            try {
              execSync(`git rev-parse -q --verify refs/tags/${tag}`, {
                stdio: "ignore",
              });
              return true;
            } catch {
              // continue
            }
            try {
              execSync(`gh release view ${tag}`, {
                stdio: "ignore",
                env: process.env,
              });
              return true;
            } catch {
              return false;
            }
          };

          let guard = 0;
          while (exists(fmt(next)) && guard < 1000) {
            next = bump(next);
            guard += 1;
          }

          process.stdout.write(fmt(next));
          EOF
          )"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${VERSION}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version computed: ${VERSION}"
            exit 1
          fi

      - name: Bump package version
        if: steps.skip.outputs.skip != 'true'
        run: |
          npm pkg set "version=${{ steps.meta.outputs.version }}" -w create-zenpanel
          npm install --package-lock-only

      - name: Build CLI
        if: steps.skip.outputs.skip != 'true'
        run: npm run build

      - name: Typecheck CLI
        if: steps.skip.outputs.skip != 'true'
        run: npm run typecheck

      - name: Commit version bump
        if: steps.skip.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/create-zenpanel/package.json package-lock.json
          if git diff --staged --quiet; then
            echo "version files already at ${{ steps.meta.outputs.version }}"
          else
            git commit -m "chore(release): v${{ steps.meta.outputs.version }} [skip release]"
          fi

      - name: Decide publish targets
        if: steps.skip.outputs.skip != 'true'
        id: gate
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "create-zenpanel@${VERSION}" version >/dev/null 2>&1; then
            echo "create-zenpanel@${VERSION} already on npmjs — will skip npmjs publish."
            echo "publish_npmjs=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_npmjs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npmjs.com (Trusted Publisher)
        if: steps.skip.outputs.skip != 'true' && steps.gate.outputs.publish_npmjs == 'true'
        working-directory: packages/create-zenpanel
        run: npm publish --access public
        # No NODE_AUTH_TOKEN — OIDC Trusted Publisher authenticates this step.

      - name: Publish to GitHub Packages
        if: steps.skip.outputs.skip != 'true'
        working-directory: packages/create-zenpanel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' \
            '@foisalislambd:registry=https://npm.pkg.github.com' \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            > "$HOME/.npmrc-github"

          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "@foisalislambd/create-zenpanel@${VERSION}" version \
            --userconfig "$HOME/.npmrc-github" >/dev/null 2>&1; then
            echo "@foisalislambd/create-zenpanel@${VERSION} already on GitHub Packages — skipping."
            exit 0
          fi

          # Mutate only the publish working copy — do not amend the version commit.
          cp package.json package.json.release-backup
          npm pkg set name="@foisalislambd/create-zenpanel"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
          npm publish --userconfig "$HOME/.npmrc-github"
          mv package.json.release-backup package.json

      - name: Push version commit and create GitHub Release
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git fetch origin main
          # Rebase version commit onto latest main if needed (avoid non-fast-forward).
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi

          if ! git push origin HEAD:main; then
            echo "::error::Failed to push version commit to main (branch protection?)."
            exit 1
          fi

          NOTES="$(printf '%s\n' \
            "Automated release of \`create-zenpanel@${VERSION}\`." \
            "" \
            "- npmjs: https://www.npmjs.com/package/create-zenpanel/v/${VERSION}" \
            "- GitHub Packages: \`@foisalislambd/create-zenpanel@${VERSION}\`")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping create."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --notes "$NOTES"
