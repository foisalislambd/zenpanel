# Publishes create-zenpanel after CI succeeds on main.
# The version in the root package.json is the release version. Nothing is auto-bumped.
# A release runs only when that version is strictly greater than the latest GitHub Release.
# Order: compare version → npmjs (Trusted Publisher) → GitHub Packages → GitHub Release + tag.
# If CI fails, this workflow does not publish.
#
# Skip: put [skip release] in the commit message (no npm / GitHub Packages / release).
#
# npm Trusted Publisher (one-time on npmjs.com → create-zenpanel → Settings):
#   Organization or user: foisalislambd
#   Repository:           zenpanel
#   Workflow filename:    release.yml
#   Allowed actions:      npm publish

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and release
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
      id-token: write
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check [skip release]
        id: skip
        run: |
          MSG="$(git log -1 --format=%B)"
          echo "Head commit message:"
          printf '%s\n' "$MSG"
          if printf '%s\n' "$MSG" | grep -qi '\[skip release\]'; then
            echo "Skipping release — commit contains [skip release]."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare package.json version to current release
        id: meta
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT="$(node <<'EOF'
          const { execSync } = require("node:child_process");
          const version = require("./package.json").version;

          function parse(value) {
            const match = String(value).trim().replace(/^v/, "").match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!match) return null;
            return [Number(match[1]), Number(match[2]), Number(match[3])];
          }

          function cmp(a, b) {
            for (let i = 0; i < 3; i++) {
              if (a[i] !== b[i]) return a[i] - b[i];
            }
            return 0;
          }

          const current = parse(version);
          if (!current) {
            console.error(`Invalid version in package.json: ${version}`);
            process.exit(1);
          }

          const raw = execSync("gh release list --limit 200 --json tagName", {
            encoding: "utf8",
            env: process.env,
          });
          const tags = JSON.parse(raw).map((release) => release.tagName);

          let latest = null;
          let latestTag = "";
          for (const tag of tags) {
            const parts = parse(tag);
            if (!parts) continue;
            if (!latest || cmp(parts, latest) > 0) {
              latest = parts;
              latestTag = tag;
            }
          }

          const publish = !latest || cmp(current, latest) > 0;
          const latestLabel = latest ? latest.join(".") : "none";
          process.stdout.write(
            JSON.stringify({
              version,
              tag: `v${version}`,
              publish,
              latest: latestLabel,
              latestTag,
            }),
          );
          EOF
          )"

          VERSION="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$RESULT")"
          TAG="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).tag)' "$RESULT")"
          PUBLISH="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).publish))' "$RESULT")"
          LATEST="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).latest)' "$RESULT")"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

          echo "package.json version: ${VERSION}"
          echo "Latest GitHub Release: ${LATEST}"
          if [ "$PUBLISH" = "true" ]; then
            echo "Version is greater than the current release — publishing."
          else
            echo "Skipping release — ${VERSION} is not greater than the current release (${LATEST})."
          fi

      - name: Setup Node
        if: steps.skip.outputs.skip != 'true' && steps.meta.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          # No registry-url: empty _authToken can block Trusted Publisher (OIDC).
          node-version: "24"
          cache: npm

      - name: Ensure npm supports Trusted Publisher (OIDC)
        if: steps.skip.outputs.skip != 'true' && steps.meta.outputs.publish == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.skip.outputs.skip != 'true' && steps.meta.outputs.publish == 'true'
        run: npm ci

      - name: Build CLI
        if: steps.skip.outputs.skip != 'true' && steps.meta.outputs.publish == 'true'
        run: npm run build

      - name: Typecheck CLI
        if: steps.skip.outputs.skip != 'true' && steps.meta.outputs.publish == 'true'
        run: npm run typecheck

      - name: Apply release version to create-zenpanel
        if: steps.skip.outputs.skip != 'true' && steps.meta.outputs.publish == 'true'
        run: npm pkg set "version=${{ steps.meta.outputs.version }}" -w create-zenpanel

      - name: Decide publish targets
        if: steps.skip.outputs.skip != 'true' && steps.meta.outputs.publish == 'true'
        id: gate
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "create-zenpanel@${VERSION}" version >/dev/null 2>&1; then
            echo "create-zenpanel@${VERSION} already on npmjs — will skip npmjs publish."
            echo "publish_npmjs=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_npmjs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npmjs.com (Trusted Publisher)
        if: steps.skip.outputs.skip != 'true' && steps.meta.outputs.publish == 'true' && steps.gate.outputs.publish_npmjs == 'true'
        working-directory: packages/create-zenpanel
        run: npm publish --access public
        # No NODE_AUTH_TOKEN — OIDC Trusted Publisher authenticates this step.

      - name: Publish to GitHub Packages
        if: steps.skip.outputs.skip != 'true' && steps.meta.outputs.publish == 'true'
        working-directory: packages/create-zenpanel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' \
            '@foisalislambd:registry=https://npm.pkg.github.com' \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            > "$HOME/.npmrc-github"

          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "@foisalislambd/create-zenpanel@${VERSION}" version \
            --userconfig "$HOME/.npmrc-github" >/dev/null 2>&1; then
            echo "@foisalislambd/create-zenpanel@${VERSION} already on GitHub Packages — skipping."
            exit 0
          fi

          # Mutate only the publish working copy.
          cp package.json package.json.release-backup
          npm pkg set name="@foisalislambd/create-zenpanel"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
          npm publish --userconfig "$HOME/.npmrc-github"
          mv package.json.release-backup package.json

      - name: Create GitHub Release
        if: steps.skip.outputs.skip != 'true' && steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          NOTES="$(printf '%s\n' \
            "Release of \`create-zenpanel@${VERSION}\`." \
            "" \
            "- npmjs: https://www.npmjs.com/package/create-zenpanel/v/${VERSION}" \
            "- GitHub Packages: \`@foisalislambd/create-zenpanel@${VERSION}\`")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping create."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --notes "$NOTES"
